<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Прятки в Бобруйске</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            padding: 20px;
            overflow-y: auto;
        }
        .screen.active { display: flex; }
        .screen h2 {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 30px;
            color: #333;
        }
        .input-group { margin-bottom: 20px; }
        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #555;
        }
        .input-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: border 0.2s;
        }
        .input-group input:focus { border-color: #2a8cff; }
        .btn {
            width: 100%;
            padding: 16px;
            background: #2a8cff;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn:hover { background: #1a6fcf; }
        .btn:active { transform: scale(0.97); }
        #map {
            flex: 1;
            min-height: 300px;
            border-radius: 12px;
            margin: 10px 0;
            background: #e9eef2;
            z-index: 1;
        }
        .status-bar {
            padding: 10px 0;
            text-align: center;
            color: #666;
            font-size: 14px;
            border-top: 1px solid #eee;
        }
        .hint {
            font-size: 14px;
            color: #888;
            margin-top: 4px;
        }
        .back-btn {
            background: #eee;
            color: #333;
            margin-top: 5px;
        }
        .back-btn:hover { background: #ddd; }
        .error-msg {
            color: #d32f2f;
            background: #ffebee;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            text-align: center;
            display: none;
        }
        .geo-status {
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 20px;
            background: #f0f0f0;
            display: inline-block;
            margin: 5px auto;
        }
        #geoRequestBtn {
            background: #4CAF50;
            margin-top: 5px;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Экран 1 -->
    <div id="screen1" class="screen active">
        <h2>🔍 Кто ищет?</h2>
        <div class="input-group">
            <label>Telegram ID искателя</label>
            <input type="number" id="seeker_id" placeholder="123456789" inputmode="numeric">
            <div class="hint">Введите числовой ID пользователя</div>
        </div>
        <button class="btn" onclick="goToScreen(2)">Далее →</button>
        <div style="text-align:center;margin-top:15px;">
            <span class="geo-status" id="geoStatus">📍 Определение местоположения...</span>
        </div>
    </div>

    <!-- Экран 2 -->
    <div id="screen2" class="screen">
        <h2>🙈 Кто прячется?</h2>
        <div class="input-group">
            <label>ID прячущихся (через запятую)</label>
            <input type="text" id="hiders_ids" placeholder="111, 222, 333">
            <div class="hint">Перечислите числовые ID через запятую</div>
        </div>
        <button class="btn" onclick="startGame()">🚀 Начать игру</button>
        <button class="btn back-btn" onclick="goToScreen(1)">← Назад</button>
        <div style="text-align:center;margin-top:10px;">
            <button class="btn" id="geoRequestBtn" onclick="requestGeolocation()">📍 Запросить геолокацию</button>
        </div>
    </div>

    <!-- Экран 3: карта -->
    <div id="screen3" class="screen">
        <h2>🗺️ Бобруйск</h2>
        <div id="map"></div>
        <div id="map-error" class="error-msg">⚠️ Не удалось загрузить карту. Проверьте интернет.</div>
        <div class="status-bar" id="status">Загрузка карты...</div>
    </div>
</div>

<!-- Telegram WebApp SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>
    // --- КОНФИГУРАЦИЯ ---
    const BOT_TOKEN = '8817333207:AAHvIQOGdt8Sqr51RsKmmcbVie5wLn3f_38';  // ваш токен
    const APP_URL = window.location.origin + window.location.pathname; // базовый URL приложения

    // --- Глобальные переменные ---
    let tg = window.Telegram.WebApp;
    let map = null;
    let marker = null;
    let watchId = null;
    let role = null;          // 'seeker' или 'hider'
    let mapReady = false;
    let userCoords = null;

    // --- Инициализация ---
    function init() {
        tg.ready();
        requestGeolocation();

        const params = new URLSearchParams(window.location.search);
        role = params.get('role');   // если есть параметр role, значит пришли по кнопке

        if (role) {
            // Сразу показываем карту
            showScreen(3);
            initMap();
            if (role === 'hider') {
                startLocationTracking();
                document.getElementById('status').innerText = '📍 Отправляем вашу геолокацию...';
            } else {
                document.getElementById('status').innerText = '👀 Вы искатель, ожидайте координаты прячущихся.';
            }
        } else {
            showScreen(1);
        }
    }

    // --- Запрос геолокации ---
    function requestGeolocation() {
        if (!navigator.geolocation) {
            document.getElementById('geoStatus').innerHTML = '❌ Геолокация не поддерживается';
            return;
        }
        navigator.geolocation.getCurrentPosition(
            function(pos) {
                userCoords = {
                    lat: pos.coords.latitude,
                    lon: pos.coords.longitude
                };
                document.getElementById('geoStatus').innerHTML =
                    `✅ Местоположение определено (${userCoords.lat.toFixed(4)}, ${userCoords.lon.toFixed(4)})`;
                if (marker && mapReady) {
                    marker.setLatLng([userCoords.lat, userCoords.lon]);
                    map.setView([userCoords.lat, userCoords.lon], 14);
                }
            },
            function(err) {
                console.warn('Геолокация отклонена:', err);
                document.getElementById('geoStatus').innerHTML = '⚠️ Доступ запрещён. Нажмите "Запросить геолокацию".';
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }

    // --- Переключение экранов ---
    function showScreen(num) {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        document.getElementById('screen' + num).classList.add('active');
    }

    function goToScreen(num) {
        if (num === 2) {
            const seeker = document.getElementById('seeker_id').value.trim();
            if (!seeker) { alert('Введите ID искателя'); return; }
            requestGeolocation(); // повторный запрос по действию пользователя
        }
        showScreen(num);
    }

    // --- Отправка сообщения через Telegram Bot API ---
    function sendTelegramMessage(chatId, text, roleForButton) {
        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
        const webAppUrl = APP_URL + `?role=${roleForButton}`;
        const payload = {
            chat_id: chatId,
            text: text,
            reply_markup: {
                inline_keyboard: [
                    [{ text: '🗺️ Открыть карту', web_app: { url: webAppUrl } }]
                ]
            }
        };
        return fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            if (!data.ok) console.warn('Ошибка отправки для', chatId, data.description);
            return data;
        })
        .catch(err => console.error('Ошибка fetch:', err));
    }

    // --- Запуск игры ---
    function startGame() {
        const seeker = document.getElementById('seeker_id').value.trim();
        const hidersRaw = document.getElementById('hiders_ids').value.trim();
        if (!seeker || !hidersRaw) { alert('Заполните все поля'); return; }
        if (isNaN(seeker)) { alert('ID искателя должен быть числом'); return; }
        const hiders = hidersRaw.split(',').map(s => s.trim()).filter(s => s && !isNaN(s));
        if (!hiders.length) { alert('Введите хотя бы одного прячущегося'); return; }

        // 1. Сообщаем боту о создании игры (через WebApp)
        const payload = {
            action: 'start_game',
            seeker_id: parseInt(seeker),
            hiders: hiders.join(',')
        };
        tg.sendData(JSON.stringify(payload));

        // 2. Отправляем уведомления всем участникам через Bot API
        const messageText = '🎮 Игра в прятки началась! Нажмите кнопку, чтобы открыть карту.';
        const allParticipants = [parseInt(seeker), ...hiders.map(Number)];
        const promises = allParticipants.map(chatId => {
            const roleForButton = (chatId === parseInt(seeker)) ? 'seeker' : 'hider';
            return sendTelegramMessage(chatId, messageText, roleForButton);
        });

        Promise.all(promises).then(() => {
            console.log('Все уведомления отправлены');
        }).catch(err => console.error('Ошибка при рассылке:', err));

        // 3. Показываем карту текущему пользователю (организатору)
        showScreen(3);
        initMap();
        document.getElementById('status').innerText = 'Игра создана! Участники получат уведомления.';
    }

    // --- Инициализация карты (Leaflet + OSM + спутник Esri) ---
    function initMap() {
        if (mapReady) return;
        try {
            const center = userCoords ? [userCoords.lat, userCoords.lon] : [53.1389, 29.2211];
            map = L.map('map').setView(center, 14);

            // Основной слой (подписи)
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            // Спутниковый слой (Esri)
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri'
            }).addTo(map);

            // Маркер
            const icon = L.divIcon({
                className: 'custom-div-icon',
                html: '<div style="background:#ff4444;width:20px;height:20px;border-radius:50%;border:3px solid white;box-shadow:0 0 10px rgba(0,0,0,0.5);"></div>',
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            });
            marker = L.marker(center, { icon: icon, draggable: false }).addTo(map)
                .bindPopup('Вы здесь');

            if (!userCoords) requestGeolocation();

            mapReady = true;
            document.getElementById('map-error').style.display = 'none';
            document.getElementById('status').innerText = 'Карта загружена';
        } catch (e) {
            console.error('Ошибка карты:', e);
            document.getElementById('map-error').style.display = 'block';
            document.getElementById('status').innerText = '❌ Ошибка карты. Проверьте интернет.';
        }
    }

    // --- Отслеживание для прячущихся (отправка координат через WebApp) ---
    function startLocationTracking() {
        if (!navigator.geolocation) {
            document.getElementById('status').innerText = '❌ Геолокация не поддерживается';
            return;
        }
        watchId = navigator.geolocation.watchPosition(
            function(pos) {
                const payload = {
                    action: 'update_location',
                    lat: pos.coords.latitude,
                    lon: pos.coords.longitude
                };
                tg.sendData(JSON.stringify(payload));
                if (marker && mapReady) {
                    marker.setLatLng([pos.coords.latitude, pos.coords.longitude]);
                    map.setView([pos.coords.latitude, pos.coords.longitude], 14);
                }
                document.getElementById('status').innerText =
                    `📍 Отправлено: ${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`;
            },
            function(err) {
                document.getElementById('status').innerText = '⚠️ Ошибка получения координат.';
            },
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 }
        );
    }

    // --- Запуск ---
    init();
</script>
</body>
</html>
