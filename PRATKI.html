<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Прятки в Бобруйске</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            padding: 20px;
            overflow-y: auto;
        }
        .screen.active { display: flex; }
        .screen h2 {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 30px;
            color: #333;
        }
        .input-group { margin-bottom: 20px; }
        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #555;
        }
        .input-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: border 0.2s;
        }
        .input-group input:focus { border-color: #2a8cff; }
        .btn {
            width: 100%;
            padding: 16px;
            background: #2a8cff;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn:hover { background: #1a6fcf; }
        .btn:active { transform: scale(0.97); }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #c82333; }
        .btn-success { background: #28a745; }
        .btn-success:hover { background: #218838; }
        #map {
            flex: 1;
            min-height: 250px;
            border-radius: 12px;
            margin: 10px 0;
            background: #e9eef2;
            z-index: 1;
        }
        .status-bar {
            padding: 10px 0;
            text-align: center;
            color: #666;
            font-size: 14px;
            border-top: 1px solid #eee;
        }
        .hint {
            font-size: 14px;
            color: #888;
            margin-top: 4px;
        }
        .back-btn { background: #eee; color: #333; margin-top: 5px; }
        .back-btn:hover { background: #ddd; }
        .error-msg {
            color: #d32f2f;
            background: #ffebee;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            text-align: center;
            display: none;
        }
        .geo-status {
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 20px;
            background: #f0f0f0;
            display: inline-block;
            margin: 5px auto;
        }
        #geoRequestBtn { background: #4CAF50; margin-top: 5px; }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 999;
            pointer-events: none;
        }
        .toast.show { opacity: 1; }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white;
            border-radius: 16px;
            padding: 24px;
            max-width: 90%;
            width: 360px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .modal h3 { margin-bottom: 16px; text-align: center; }
        .modal .input-group { margin-bottom: 12px; }
        .modal .btn { margin-top: 6px; }
        .modal .btn-close { background: #dc3545; }
        .modal .btn-close:hover { background: #c82333; }
        .hider-list {
            margin: 10px 0;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 8px;
        }
        .hider-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px;
            border-bottom: 1px solid #f0f0f0;
        }
        .hider-item:last-child { border-bottom: none; }
        .hider-item .name { font-weight: 500; }
        .hider-item .coords { font-size: 12px; color: #666; }
        .hider-item .del-btn {
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Экран 1: ввод искателя -->
    <div id="screen1" class="screen active">
        <h2>🔍 Кто ищет?</h2>
        <div class="input-group">
            <label>Ваш Telegram ID (искатель)</label>
            <input type="number" id="seeker_id" placeholder="123456789" inputmode="numeric" />
            <div class="hint">Введите свой числовой ID, чтобы получать уведомления</div>
        </div>
        <button class="btn" onclick="goToScreen(2)">Далее →</button>
        <div style="text-align:center;margin-top:15px;">
            <span class="geo-status" id="geoStatus">📍 Определение местоположения...</span>
        </div>
    </div>

    <!-- Экран 2: добавление прячущихся -->
    <div id="screen2" class="screen">
        <h2>🙈 Кто прячется?</h2>
        <div class="input-group">
            <label>Имя прячущегося</label>
            <input type="text" id="hider_name" placeholder="Антон" />
        </div>
        <div style="display:flex; gap:8px;">
            <button class="btn" style="flex:1;" onclick="addHiderManual()">➕ Добавить вручную</button>
            <button class="btn btn-success" style="flex:1;" onclick="addHiderGeo()">📍 Добавить мою геолокацию</button>
        </div>
        <div class="hint">Или введите координаты вручную после добавления</div>
        <div id="hiderList" class="hider-list"></div>
        <button class="btn" onclick="startGame()">🚀 Начать игру</button>
        <button class="btn back-btn" onclick="goToScreen(1)">← Назад</button>
        <div style="text-align:center;margin-top:10px;">
            <button class="btn" id="geoRequestBtn" onclick="requestGeolocation()">📍 Запросить геолокацию</button>
        </div>
    </div>

    <!-- Экран 3: карта -->
    <div id="screen3" class="screen">
        <h2>🗺️ Бобруйск</h2>
        <div style="display:flex; gap:8px; margin-bottom:6px; flex-wrap:wrap;">
            <button class="btn btn-secondary" style="flex:1;" onclick="openCheckModal()">🔍 Проверить геолокацию</button>
            <button class="btn btn-secondary" style="flex:1;" onclick="sendAllLocations()">📤 Отправить координаты сейчас</button>
        </div>
        <div id="map"></div>
        <div id="map-error" class="error-msg">⚠️ Не удалось загрузить карту. Проверьте интернет.</div>
        <div class="status-bar" id="status">Загрузка карты...</div>
    </div>
</div>

<!-- Модальное окно проверки -->
<div class="modal-overlay" id="checkModal">
    <div class="modal">
        <h3>🔎 Проверка координат</h3>
        <div class="input-group">
            <label>Широта</label>
            <input type="text" id="checkLat" placeholder="53.1389" />
        </div>
        <div class="input-group">
            <label>Долгота</label>
            <input type="text" id="checkLon" placeholder="29.2211" />
        </div>
        <button class="btn" onclick="checkLocation()">Проверить</button>
        <button class="btn btn-close" onclick="closeCheckModal()">Закрыть</button>
    </div>
</div>

<!-- Модальное окно для ручного ввода координат -->
<div class="modal-overlay" id="coordModal">
    <div class="modal">
        <h3>✏️ Введите координаты</h3>
        <div class="input-group">
            <label>Имя</label>
            <input type="text" id="editName" />
        </div>
        <div class="input-group">
            <label>Широта</label>
            <input type="text" id="editLat" placeholder="53.1389" />
        </div>
        <div class="input-group">
            <label>Долгота</label>
            <input type="text" id="editLon" placeholder="29.2211" />
        </div>
        <button class="btn" onclick="saveEditedHider()">Сохранить</button>
        <button class="btn btn-close" onclick="closeCoordModal()">Отмена</button>
    </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
    // ===== КОНФИГУРАЦИЯ =====
    const BOT_TOKEN = '8817333207:AAHvIQOGdt8Sqr51RsKmmcbVie5wLn3f_38';
    const APP_URL = window.location.origin + window.location.pathname;

    // ===== Глобальные =====
    let tg = window.Telegram.WebApp;
    let map = null, marker = null, checkMarker = null;
    let mapReady = false, userCoords = null;
    let hiders = []; // массив {id, name, lat, lon}
    let seekerId = null;
    let timerInterval = null;

    // ===== Инициализация =====
    function init() {
        tg.ready();
        requestGeolocation();

        // Загружаем сохранённые данные
        const saved = localStorage.getItem('hidersData');
        if (saved) {
            try {
                hiders = JSON.parse(saved);
                renderHiderList();
            } catch(e) {}
        }
        const savedSeeker = localStorage.getItem('seekerId');
        if (savedSeeker) {
            document.getElementById('seeker_id').value = savedSeeker;
        }

        const params = new URLSearchParams(window.location.search);
        const role = params.get('role');
        if (role === 'seeker') {
            // Искатель сразу на карту
            showScreen(3);
            initMap();
            document.getElementById('status').innerText = '👀 Вы искатель. Используйте карту.';
            startAutoSend();
        } else if (role === 'hider') {
            // Прячущийся – добавляем себя и переходим на карту
            showScreen(2);
            document.getElementById('hider_name').value = tg.initDataUnsafe?.user?.first_name || 'Игрок';
            addHiderGeo();
            showScreen(3);
            initMap();
            document.getElementById('status').innerText = '📍 Вы прячетесь. Ваша геолокация отправлена.';
            startLocationTracking();
        } else {
            showScreen(1);
        }
    }

    // ===== Геолокация =====
    function requestGeolocation() {
        if (!navigator.geolocation) {
            document.getElementById('geoStatus').innerHTML = '❌ Геолокация не поддерживается';
            return;
        }
        navigator.geolocation.getCurrentPosition(
            pos => {
                userCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
                document.getElementById('geoStatus').innerHTML =
                    `✅ Местоположение определено (${userCoords.lat.toFixed(4)}, ${userCoords.lon.toFixed(4)})`;
                if (marker && mapReady) {
                    marker.setLatLng([userCoords.lat, userCoords.lon]);
                    map.setView([userCoords.lat, userCoords.lon], 14);
                }
            },
            () => {
                document.getElementById('geoStatus').innerHTML = '⚠️ Доступ запрещён. Нажмите "Запросить геолокацию".';
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }

    // ===== Экраны =====
    function showScreen(num) {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        document.getElementById('screen' + num).classList.add('active');
    }
    function goToScreen(num) {
        if (num === 2) {
            const seeker = document.getElementById('seeker_id').value.trim();
            if (!seeker) { alert('Введите ваш ID'); return; }
            seekerId = parseInt(seeker);
            localStorage.setItem('seekerId', seekerId);
            requestGeolocation();
        }
        showScreen(num);
    }

    // ===== Управление прячущимися =====
    function generateId() { return Date.now() + Math.random(); }

    function addHiderManual() {
        const name = document.getElementById('hider_name').value.trim() || 'Игрок';
        document.getElementById('editName').value = name;
        document.getElementById('editLat').value = '';
        document.getElementById('editLon').value = '';
        document.getElementById('coordModal').classList.add('active');
    }

    function addHiderGeo() {
        const name = document.getElementById('hider_name').value.trim() || 'Игрок';
        if (!userCoords) {
            alert('Сначала определите геолокацию');
            return;
        }
        const newHider = {
            id: generateId(),
            name: name,
            lat: userCoords.lat,
            lon: userCoords.lon
        };
        hiders.push(newHider);
        saveAndRender();
        document.getElementById('hider_name').value = '';
        showToast(`✅ ${name} добавлен с геолокацией`);
    }

    function saveEditedHider() {
        const name = document.getElementById('editName').value.trim();
        const lat = parseFloat(document.getElementById('editLat').value);
        const lon = parseFloat(document.getElementById('editLon').value);
        if (!name || isNaN(lat) || isNaN(lon)) {
            alert('Введите корректные данные');
            return;
        }
        const newHider = { id: generateId(), name, lat, lon };
        hiders.push(newHider);
        saveAndRender();
        document.getElementById('coordModal').classList.remove('active');
        showToast(`✅ ${name} добавлен`);
    }

    function removeHider(id) {
        hiders = hiders.filter(h => h.id !== id);
        saveAndRender();
    }

    function saveAndRender() {
        localStorage.setItem('hidersData', JSON.stringify(hiders));
        renderHiderList();
        if (mapReady) updateMarkers();
    }

    function renderHiderList() {
        const container = document.getElementById('hiderList');
        if (!hiders.length) {
            container.innerHTML = '<div style="text-align:center;color:#999;padding:10px;">Нет добавленных</div>';
            return;
        }
        container.innerHTML = hiders.map(h =>
            `<div class="hider-item">
                <span class="name">${h.name}</span>
                <span class="coords">${h.lat.toFixed(5)}, ${h.lon.toFixed(5)}</span>
                <button class="del-btn" onclick="removeHider('${h.id}')">×</button>
            </div>`
        ).join('');
    }

    // ===== Карта =====
    function initMap() {
        if (mapReady) return;
        try {
            const center = userCoords ? [userCoords.lat, userCoords.lon] : [53.1389, 29.2211];
            map = L.map('map').setView(center, 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri'
            }).addTo(map);

            const icon = L.divIcon({
                className: 'custom-div-icon',
                html: '<div style="background:#ff4444;width:20px;height:20px;border-radius:50%;border:3px solid white;box-shadow:0 0 10px rgba(0,0,0,0.5);"></div>',
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            });
            marker = L.marker(center, { icon, draggable: false }).addTo(map).bindPopup('Вы здесь');

            updateMarkers();
            mapReady = true;
            document.getElementById('map-error').style.display = 'none';
            document.getElementById('status').innerText = 'Карта загружена';
        } catch (e) {
            document.getElementById('map-error').style.display = 'block';
            document.getElementById('status').innerText = '❌ Ошибка карты. Проверьте интернет.';
        }
    }

    function updateMarkers() {
        if (!mapReady) return;
        // Удаляем старые метки прячущихся (кроме маркера пользователя и чек-маркера)
        map.eachLayer(layer => {
            if (layer.options && layer.options._hiderId) {
                map.removeLayer(layer);
            }
        });
        const iconHider = L.divIcon({
            className: 'custom-div-icon',
            html: '<div style="background:#2a8cff;width:16px;height:16px;border-radius:50%;border:2px solid white;box-shadow:0 0 8px rgba(0,0,0,0.3);"></div>',
            iconSize: [16, 16],
            iconAnchor: [8, 8]
        });
        hiders.forEach(h => {
            const m = L.marker([h.lat, h.lon], { icon: iconHider, _hiderId: h.id })
                .addTo(map)
                .bindPopup(`<b>${h.name}</b><br>${h.lat.toFixed(5)}, ${h.lon.toFixed(5)}`);
        });
    }

    // ===== Отслеживание для прячущихся =====
    function startLocationTracking() {
        if (!navigator.geolocation) {
            document.getElementById('status').innerText = '❌ Геолокация не поддерживается';
            return;
        }
        navigator.geolocation.watchPosition(
            pos => {
                if (hiders.length > 0) {
                    hiders[0].lat = pos.coords.latitude;
                    hiders[0].lon = pos.coords.longitude;
                    saveAndRender();
                    if (marker && mapReady) {
                        marker.setLatLng([pos.coords.latitude, pos.coords.longitude]);
                        map.setView([pos.coords.latitude, pos.coords.longitude], 14);
                    }
                    document.getElementById('status').innerText =
                        `📍 Обновлено: ${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`;
                }
            },
            () => { document.getElementById('status').innerText = '⚠️ Ошибка получения координат.'; },
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 }
        );
    }

    // ===== Отправка сообщений через Bot API =====
    function sendTelegramMessage(chatId, text, parseMode = '') {
        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
        const payload = { chat_id: chatId, text };
        if (parseMode) payload.parse_mode = parseMode;
        return fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            if (!data.ok) {
                console.warn('Ошибка отправки:', data.description);
                showToast('⚠️ Не удалось отправить сообщение. Проверьте ID.');
                return false;
            }
            return true;
        })
        .catch(() => { showToast('❌ Ошибка сети'); return false; });
    }

    function sendLocation(chatId, lat, lon) {
        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`;
        return fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: chatId, latitude: lat, longitude: lon })
        })
        .then(res => res.json())
        .then(data => data.ok)
        .catch(() => false);
    }

    // ===== Отправка координат искателю =====
    async function sendAllLocations() {
        if (!seekerId) {
            const id = document.getElementById('seeker_id').value.trim();
            if (id) seekerId = parseInt(id);
            else {
                showToast('⚠️ Не указан ID искателя');
                return;
            }
        }
        if (!hiders.length) {
            showToast('Нет прячущихся для отправки');
            return;
        }
        let success = true;
        for (const h of hiders) {
            const text = `📍 <b>${h.name}</b> находится здесь:`;
            const ok1 = await sendTelegramMessage(seekerId, text, 'HTML');
            const ok2 = await sendLocation(seekerId, h.lat, h.lon);
            if (!ok1 || !ok2) success = false;
        }
        if (success) {
            showToast(`✅ Координаты отправлены искателю (${hiders.length} человек)`);
        } else {
            showToast('⚠️ Часть сообщений не доставлена');
        }
    }

    function startAutoSend() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(sendAllLocations, 120000); // 2 минуты
        showToast('🔄 Автоотправка каждые 2 минуты запущена');
    }

    // ===== Проверка геолокации =====
    function openCheckModal() {
        document.getElementById('checkModal').classList.add('active');
        document.getElementById('checkLat').value = '';
        document.getElementById('checkLon').value = '';
    }
    function closeCheckModal() {
        document.getElementById('checkModal').classList.remove('active');
    }

    function checkLocation() {
        const lat = parseFloat(document.getElementById('checkLat').value);
        const lon = parseFloat(document.getElementById('checkLon').value);
        if (isNaN(lat) || isNaN(lon)) {
            alert('Введите корректные координаты');
            return;
        }

        // Ставим метку на карте
        if (checkMarker) map.removeLayer(checkMarker);
        const icon = L.divIcon({
            className: 'custom-div-icon',
            html: '<div style="background:#ffaa00;width:20px;height:20px;border-radius:50%;border:3px solid white;box-shadow:0 0 10px rgba(0,0,0,0.5);"></div>',
            iconSize: [20, 20],
            iconAnchor: [10, 10]
        });
        checkMarker = L.marker([lat, lon], { icon, draggable: false }).addTo(map)
            .bindPopup('Проверяемая точка');
        map.setView([lat, lon], 16);

        // Ищем совпадения (погрешность 0.00001°)
        const found = hiders.filter(h =>
            Math.abs(h.lat - lat) < 0.00001 && Math.abs(h.lon - lon) < 0.00001
        );
        if (found.length) {
            const names = found.map(h => h.name).join(', ');
            showToast(`✅ Найдено: ${names}`);
        } else {
            showToast('❌ Никого не найдено');
        }
        closeCheckModal();
    }

    // ===== Модалка для ручного ввода =====
    function closeCoordModal() {
        document.getElementById('coordModal').classList.remove('active');
    }

    // ===== Запуск игры =====
    function startGame() {
        if (!seekerId) {
            const id = document.getElementById('seeker_id').value.trim();
            if (!id) { alert('Введите ID искателя'); return; }
            seekerId = parseInt(id);
            localStorage.setItem('seekerId', seekerId);
        }
        if (!hiders.length) {
            alert('Добавьте хотя бы одного прячущегося');
            return;
        }
        showScreen(3);
        initMap();
        document.getElementById('status').innerText = 'Игра началась! Отправка координат каждые 2 минуты.';
        startAutoSend();
        // Отправляем первый раз сразу
        setTimeout(sendAllLocations, 2000);
    }

    // ===== Toast =====
    function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 5000);
    }

    // ===== Запуск =====
    init();
</script>
</body>
</html>
